 q('planet-image').className='rc-big-moon rc-planet-'+key;
 q('planet-image').setAttribute('aria-label',d.alt);q('arrival-label').textContent=d.name+' 탐사 성공!';
 r.querySelectorAll('[data-planet]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.planet===key));
 closeDest();
}
q('dest-toggle').onclick=()=>{const open=q('dest-menu').hidden;q('dest-menu').hidden=!open;q('dest-toggle').setAttribute('aria-expanded',String(open));};
r.querySelectorAll('[data-planet]').forEach(b=>b.onclick=()=>{selectDest(b.dataset.planet);q('dest-toggle').focus();});
r.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDest();q('dest-toggle').focus();}});
r.addEventListener('click',e=>{if(!e.target.closest('.rc-picker'))closeDest();});
function name(){return q('class').value.trim()||'우리 반'}
let soundEnabled=true,audioContext=null,lastCueSecond=null;
const sounding=new Set();
function stopSound(){for(const voice of sounding){try{voice.osc.stop();voice.osc.disconnect();voice.gain.disconnect();}catch{}}sounding.clear();}
function unlockAudio(){
 if(!soundEnabled)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 if(!audioContext)audioContext=new Audio();
 if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
 }catch{}
}
function chime(seconds){
 if(!soundEnabled||!audioContext||audioContext.state!=='running'||document.hidden)return;
 try{
 const osc=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime;
 const voice={osc,gain};sounding.add(voice);
 osc.type='sine';osc.frequency.setValueAtTime(seconds===0?523:seconds<=3?784:659,t);
 gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.09,t+.025);
 gain.gain.exponentialRampToValueAtTime(.001,t+.22);
 osc.connect(gain);gain.connect(audioContext.destination);
 osc.onended=()=>{sounding.delete(voice);osc.disconnect();gain.disconnect();};
 osc.start(t);osc.stop(t+.24);
 }catch{}
}
q('sound').onclick=()=>{soundEnabled=!soundEnabled;q('sound').setAttribute('aria-pressed',String(soundEnabled));q('sound').textContent=soundEnabled?'소리 켜짐':'소리 꺼짐';if(soundEnabled)unlockAudio();else stopSound();};
function clock(){
 q('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
 const active=['running','paused','waiting'].includes(state);
 const urgency=active?(left<=10?'urgent':left<=30?'soon':'normal'):'normal';
 r.dataset.urgency=urgency;
 const color=urgency==='urgent'?'#ffb174':urgency==='soon'?'#ffe08a':'#84e6cf';
 const deg=Math.max(0,Math.min(360,left/total*360));
 q('orbit').style.background=`conic-gradient(${color} 0deg ${deg}deg,#344058 ${deg}deg 360deg)`;
 q('orbit').setAttribute('aria-valuenow',left);q('orbit').setAttribute('aria-valuemax',total);
 q('orbit').setAttribute('aria-valuetext',left+'초 남음');
 if(state==='running'){
 q('time-label').textContent=left<=10?'곧 출발할 시간!':left<=30?'출발 준비를 서둘러요':'남은 시간';
 q('status').textContent=left<=10?'● 곧 출발해요!':left<=30?'● 출발 준비!':'● 정리하고 있어요';
 if(left!==lastCueSecond){lastCueSecond=left;if([30,10,3,2,1,0].includes(left))chime(left);}
 }
}
function setState(s){state=s;if(s!=='running'&&s!=='waiting')stopSound();closeDest();q('dest-toggle').disabled=s==='launch'||s==='arrived';r.dataset.state=s;q('arrival').hidden=s!=='arrived';if(s==='ready'||s==='arrived'){q('flight-canvas').hidden=true;flightCanvas=null;}if(s==='ready'){delete r.dataset.flight;q('count').textContent='';q('craft').style.removeProperty('top');q('craft').style.removeProperty('transition');}if(s==='launch')r.dataset.flight='countdown';q('settings').hidden=s!=='ready';q('active').hidden=!['running','paused','waiting','launch'].includes(s);q('pause').hidden=s==='waiting'||s==='launch';q('add').hidden=s==='launch';q('pause').textContent=s==='paused'?'계속하기':'일시정지';q('add').textContent=s==='waiting'?'1분 더 준비':'+1분';q('primary').disabled=s==='launch';q('primary').textContent=s==='ready'?'정리 시작 ↗':s==='arrived'?'다시 준비하기':s==='launch'?'우주로 출발 중…':'정리 완료 · 발사!';q('status').textContent={ready:'● 출발 준비',running:'● 정리하고 있어요',paused:'Ⅱ 잠시 쉬는 중',waiting:'● 친구들을 기다려요',launch:'● 탑승 완료',arrived:'✓ 탐사 성공'}[s];clock();}
function preset(seconds){duration=total=left=seconds;q('min').value=seconds>=60?seconds/60:'';r.querySelectorAll('[data-sec]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.sec)===seconds));clock()}
r.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>preset(Number(b.dataset.sec)));q('min').onchange=()=>preset(60*Math.max(1,Math.min(30,Math.round(Number(q('min').value)||3))));q('class').oninput=()=>q('title').textContent='시간 내 우주선을 발사하자!';
function resetTimer(){
 cancelAnimationFrame(frame);frame=0;stopSound();lastCueSecond=null;
 flightCanvas=null;flightCtx=null;flightElapsed=0;flightLast=0;launchAt=0;onTime=true;
 setState('ready');preset(duration);
 q('craft').style.transform='';q('craft').style.opacity='';
 q('craft').setAttribute('aria-label','발사대에서 기다리는 로켓');
 q('checks').style.visibility='';q('title').textContent='시간 내 우주선을 발사하자!';
 q('message').textContent='';q('time-label').textContent='정리할 시간';q('time').style.fontSize='';
 q('min').focus();
}
q('reset').onclick=resetTimer;
q('primary').onclick=()=>{
 if(state==='ready'){
 unlockAudio();lastCueSecond=null;end=Date.now()+left*1000;onTime=true;setState('running');
 q('title').textContent='시간 내 우주선을 발사하자!';loop();
 }else if(['running','paused','waiting'].includes(state)){
 if(state==='running')left=Math.max(0,Math.ceil((end-Date.now())/1000));
 onTime=onTime&&left>0;setState('launch');launchAt=Date.now();
 q('title').textContent=name()+', 탑승 완료!';q('message').textContent='우리 함께 외쳐요. 5, 4, 3, 2, 1!';
 q('checks').style.visibility='hidden';loop();
 }else if(state==='arrived')resetTimer();
};
q('pause').onclick=()=>{if(state==='running'){left=Math.max(0,Math.ceil((end-Date.now())/1000));setState('paused');clock();q('message').textContent='준비가 되면 다시 시작해요.'}else{unlockAudio();end=Date.now()+left*1000;setState('running');loop()}};
q('add').onclick=()=>{if(state==='running')left=Math.max(0,Math.ceil((end-Date.now())/1000));left+=60;total+=60;lastCueSecond=left;clock();if(state!=='paused'){end=Date.now()+left*1000;setState('running');loop()}};

function beginFlight(){
  const box=r.querySelector('.rc-space').getBoundingClientRect(), ship=q('craft').getBoundingClientRect();
  flightCanvas=q('flight-canvas');flightCanvas.width=Math.max(1,Math.round(box.width*2));flightCanvas.height=Math.max(1,Math.round(box.height*2));
  flightCtx=flightCanvas.getContext('2d');flightX=(ship.left+ship.width/2)-box.left;flightStart=ship.top-box.top;flightScale=ship.width/108;
  flightDistance=flightStart+270*flightScale+30;flightElapsed=0;flightLast=performance.now();
  flightCanvas.hidden=false;r.dataset.flight='flying';q('count').textContent='';q('status').textContent='● '+destinations[destination].name+' 탐사 중';q('message').textContent='출발! '+destinations[destination].name+'을 향해 날아가요.';
}
function drawShip(y){
  const c=flightCtx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,flightCanvas.width,flightCanvas.height);c.scale(2,2);c.translate(flightX,y);c.scale(flightScale,flightScale);c.translate(-54,0);
  function shape(fill,points){c.fillStyle=fill;c.beginPath();points(c);c.closePath();c.fill();}
  const flame=c.createLinearGradient(0,170,0,255);flame.addColorStop(0,'#fff4b6');flame.addColorStop(.45,'#ffb36a');flame.addColorStop(1,'#ffb36a00');
  shape(flame,c=>{c.moveTo(36,171);c.lineTo(72,171);c.quadraticCurveTo(70,224,54,258);c.quadraticCurveTo(38,224,36,171)});
  shape('#74d0bd',c=>{c.moveTo(22,98);c.quadraticCurveTo(0,112,0,174);c.lineTo(28,156)});
  shape('#5cbaab',c=>{c.moveTo(86,98);c.quadraticCurveTo(108,112,108,174);c.lineTo(80,156)});
  c.fillStyle='#6c899c';c.fillRect(32,158,44,16);
  const body=c.createLinearGradient(14,0,94,0);body.addColorStop(0,'#b8ced9');body.addColorStop(.45,'#f6fafb');body.addColorStop(1,'#bdcfd8');
  c.save();c.beginPath();c.moveTo(54,0);c.bezierCurveTo(87,0,94,49,94,64);c.lineTo(94,144);c.quadraticCurveTo(94,163,78,163);c.lineTo(30,163);c.quadraticCurveTo(14,163,14,144);c.lineTo(14,64);c.bezierCurveTo(14,49,21,0,54,0);c.closePath();c.fillStyle=body;c.fill();c.clip();
  const nose=c.createLinearGradient(14,0,94,0);nose.addColorStop(0,'#4fb4aa');nose.addColorStop(.65,'#9cebd6');nose.addColorStop(1,'#66cdbb');c.fillStyle=nose;c.fillRect(14,0,80,48);c.fillStyle='#63c5b7';c.fillRect(14,144,80,9);c.restore();
  c.beginPath();c.arc(54,85,24,0,Math.PI*2);c.fillStyle='#aebfce';c.fill();c.beginPath();c.arc(54,85,18,0,Math.PI*2);c.fillStyle='#245773';c.fill();
  c.save();c.translate(48,78);c.rotate(-.6);c.fillStyle='#a3e6e7';c.beginPath();c.ellipse(0,0,9,3,0,0,Math.PI*2);c.fill();c.restore();
  c.fillStyle='#4c6b7c';c.font='9px sans-serif';c.textAlign='center';c.fillText('KIDKIDS',54,131);
}
function advanceFlight(){
  if(!flightCanvas){beginFlight();drawShip(flightStart);return false;}
  const now=performance.now();flightElapsed+=Math.min(40,Math.max(0,now-flightLast));flightLast=now;
  const p=Math.min(1,flightElapsed/4200);const eased=.35*p+.65*p*p;
  drawShip(flightStart-flightDistance*eased);
  return flightElapsed>=4500;
}

function loop(){cancelAnimationFrame(frame);if(!r.isConnected)return;if(state==='running'){left=Math.max(0,Math.ceil((end-Date.now())/1000));clock();const msg='모두 준비되면, 로켓 발사!';if(q('message').textContent!==msg)q('message').textContent=msg;if(!left){onTime=false;setState('waiting');q('title').textContent='로켓이 우리 반을 기다려요';q('message').textContent='괜찮아요. 함께 마무리하고 출발해요!';return}}else if(state==='launch'){const t=(Date.now()-launchAt)/1000;if(t<5){const n=String(5-Math.floor(t));if(q('count').textContent!==n)q('count').textContent=n}else if(!advanceFlight()){frame=requestAnimationFrame(loop);return}else{q('count').textContent='';q('craft').setAttribute('aria-label',destinations[destination].name+'에 도착한 우리 반 로켓');setState('arrived');q('title').textContent=name()+', '+destinations[destination].name+'에 도착했어요!';q('message').textContent=onTime?'시간 도전 성공! 우리 반 임무 완료!':'모두 힘을 모아 임무를 완료했어요!';q('time-label').textContent='탐사 완료';q('time').textContent='MISSION CLEAR';q('time').style.fontSize='19px';return}}else return;frame=requestAnimationFrame(loop)}
const original=q('primary').onclick;q('primary').onclick=()=>{q('time').style.fontSize='';original()};selectDest('moon');setState('ready');clock();
const stageFit=r.querySelector('.rc-stage-fit');
function fitStage(){const b=stageFit.getBoundingClientRect();const factor=Math.max(.1,Math.min((b.width-8)/350,(b.height-8)/350,2.5));r.style.setProperty('--rc-stage-scale',String(factor));}
const fitObserver=new ResizeObserver(fitStage);fitObserver.observe(stageFit);fitStage();

})();
</script>
